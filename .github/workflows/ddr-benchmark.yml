name: DDR benchmark
on: [push, pull_request]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: ./benchmark.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ddr-benchmark-results
          path: benchmark-results.json
