name: Glider change completed-route gallery
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact bus solver source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  route:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        sample: [control, control-inner1, right, left, above, inner-layers, inner-layers-right, inner-layers-left, inner-layers-above, inner-layers-complete-ca, outer-layers]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --ignore-scripts --backend=copyfile
      - name: Fresh accepted head solve
        run: bun scripts/benchmark.ts --worker '${{ matrix.sample }}' --timeout-seconds 3600 --routes-directory completed > solve.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routes-${{ matrix.sample }}
          path: |
            completed/
            solve.log
  gallery:
    needs: route
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --ignore-scripts --backend=copyfile
      - uses: actions/download-artifact@v4
        with:
          pattern: routes-*
          path: captured
      - name: Validate every completed sample before exporting
        run: |
          cat > export-gallery.ts <<'TS'
          import { readFileSync } from "node:fs"
          import { loadAm3352Sample, am3352SamplePlacements } from "./scripts/am3352-samples"
          import { exportAm3352RoutedSnapshots } from "./scripts/snapshot-routed-am3352"
          const candidates = []
          for (const placement of am3352SamplePlacements) {
            const saved = JSON.parse(readFileSync(`captured/routes-${placement.name}/completed/${placement.name}.json`, "utf8"))
            const { metadata } = await loadAm3352Sample(placement.name)
            candidates.push({ solver: { ...saved, getOutput: () => saved.output }, metadata })
          }
          await exportAm3352RoutedSnapshots(candidates, "gallery")
          TS
          bun export-gallery.ts
      - uses: actions/upload-artifact@v4
        with:
          name: validated-gallery
          path: gallery/
