name: OrangeCrab native baseline diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install the Ubuntu KiCad CLI
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y kicad
          dpkg-query --show kicad
          kicad-cli version
      - name: Download the pinned original source and verify its hash
        run: |
          source_url=https://raw.githubusercontent.com/orangecrab-fpga/orangecrab-hardware/c511d569fe2af39467041f888bc231020f40c6ac/hardware/orangecrab_r0.2.1
          curl --fail --location "$source_url/OrangeCrab.kicad_pcb" --output OrangeCrab.kicad_pcb
          curl --fail --location "$source_url/OrangeCrab.pro" --output OrangeCrab.pro
          echo '4597f3ac08e21c09253b27ca1b9e26aaf3c3d3e2147b6c0d79c0dc6aa555e201  OrangeCrab.kicad_pcb' | sha256sum --check
      - name: Read-only native source DRC
        run: |
          kicad-cli pcb drc --help
          kicad-cli pcb drc --format json --output original-drc.json OrangeCrab.kicad_pcb
          test -s original-drc.json
          echo '4597f3ac08e21c09253b27ca1b9e26aaf3c3d3e2147b6c0d79c0dc6aa555e201  OrangeCrab.kicad_pcb' | sha256sum --check
      - name: Report native baseline findings without publishing routing artifacts
        run: |
          python3 - <<'PYTHON'
          import collections, json
          from pathlib import Path
          report = json.loads(Path('original-drc.json').read_text())
          violations = report.get('violations', [])
          print('DIAGNOSTIC ONLY: command completion is not board acceptance.')
          print(json.dumps({'violations': len(violations), 'byType': dict(collections.Counter(v.get('type') for v in violations)), 'unconnectedItems': len(report.get('unconnected_items', []))}, indent=2))
          for violation in violations:
              items = violation.get('items', [])
              text = json.dumps(items)
              if 'U9' in text and ('19 ' in text or '19 [' in text or 'Pad 19' in text):
                  print('U9_PAD19_NATIVE_FINDING', json.dumps(violation))
          PYTHON
