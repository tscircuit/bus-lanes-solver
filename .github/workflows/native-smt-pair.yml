name: Native SMT pair corridor
on:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install before timing
        run: |
          (cd base && bun install --ignore-scripts)
          (cd head && bun install --ignore-scripts)
      - name: Fresh base and head using the same fixture and budgets
        run: |
          mkdir -p results
          bun head/scripts/benchmark-native-smt-pair.ts base/lib/index.ts results/base.json || true
          bun head/scripts/benchmark-native-smt-pair.ts head/lib/index.ts results/head.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smt-pair-comparison
          path: results/
          retention-days: 30
