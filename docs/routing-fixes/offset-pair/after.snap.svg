ata-y="1.2000000000000002" cx="913.375" cy="434.25" r="9.5625" fill="transparent" stroke="#dc2626" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.700000000000001" data-y="1.2000000000000002" cx="913.375" cy="434.25" r="9.5625" fill="transparent" stroke="#ca8a04" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.700000000000001" data-y="1.2000000000000002" cx="913.375" cy="434.25" r="9.5625" fill="transparent" stroke="#16a34a" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.700000000000001" data-y="1.2000000000000002" cx="913.375" cy="434.25" r="9.5625" fill="transparent" stroke="#2563eb" stroke-width="0.01568627450980392"/><text data-type="text" data-label="Offset packages: automatic differential-pair approaches" data-x="-8" data-y="7" x="40" y="64.5" fill="#334155" font-size="15.692307692307693" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Offset packages: automatic differential-pair approaches</text><text data-type="text" data-label="AFTER: 2/2 connected | copper DRC passed" data-x="-8" data-y="6.5" x="40" y="96.375" fill="#166534" font-size="15.692307692307693" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">AFTER: 2/2 connected | copper DRC passed</text><text data-type="text" data-label="0.2 mm edge clearance | 0.1 mm trace width" data-x="-8" data-y="6" x="40" y="128.25" fill="#334155" font-size="15.692307692307693" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">0.2 mm edge clearance | 0.1 mm trace width</text><text data-type="text" data-label="0 bus / 1 pair constraints passed | pair skew 0.0343 mm" data-x="-8" data-y="5.5" x="40" y="160.125" fill="#334155" font-size="15.692307692307693" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">0 bus / 1 pair constraints passed | pair skew 0.0343 mm</text><g><circle data-type="point" data-label="P source [top]" data-x="-6" data-y="-1.5" cx="167.5" cy="606.375" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="P target [top]" data-x="6" data-y="0.5" cx="932.5" cy="478.875" r="3" fill="#d97706"/></g><g><circle data-type="point" data-label="N source [top]" data-x="-6" data-y="-0.5" cx="167.5" cy="542.625" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="N target [top]" data-x="6" data-y="1.5" cx="932.5" cy="415.125" r="3" fill="#d97706"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="894" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '894');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":63.75,"c":0,"e":550,"b":0,"d":-63.75,"f":510.75};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>