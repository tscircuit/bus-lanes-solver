9.75" cy="323.375" r="9.5625" fill="transparent" stroke="#dc2626" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.800000000000001" data-y="-0.2999999999999998" cx="919.75" cy="323.375" r="9.5625" fill="transparent" stroke="#ca8a04" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.800000000000001" data-y="-0.2999999999999998" cx="919.75" cy="323.375" r="9.5625" fill="transparent" stroke="#16a34a" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.800000000000001" data-y="-0.2999999999999998" cx="919.75" cy="323.375" r="9.5625" fill="transparent" stroke="#2563eb" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="-5.699999999999999" data-y="0.20000000000000018" cx="186.62500000000006" cy="291.5" r="9.5625" fill="transparent" stroke="#dc2626" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="-5.699999999999999" data-y="0.20000000000000018" cx="186.62500000000006" cy="291.5" r="9.5625" fill="transparent" stroke="#ca8a04" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="-5.699999999999999" data-y="0.20000000000000018" cx="186.62500000000006" cy="291.5" r="9.5625" fill="transparent" stroke="#16a34a" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="-5.699999999999999" data-y="0.20000000000000018" cx="186.62500000000006" cy="291.5" r="9.5625" fill="transparent" stroke="#2563eb" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.800000000000001" data-y="0.30000000000000027" cx="919.75" cy="285.125" r="9.5625" fill="transparent" stroke="#dc2626" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.800000000000001" data-y="0.30000000000000027" cx="919.75" cy="285.125" r="9.5625" fill="transparent" stroke="#ca8a04" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.800000000000001" data-y="0.30000000000000027" cx="919.75" cy="285.125" r="9.5625" fill="transparent" stroke="#16a34a" stroke-width="0.01568627450980392"/><circle data-type="circle" data-label="" data-x="5.800000000000001" data-y="0.30000000000000027" cx="919.75" cy="285.125" r="9.5625" fill="transparent" stroke="#2563eb" stroke-width="0.01568627450980392"/><text data-type="text" data-label="Pair-only bus: match without artificial length headroom" data-x="-8" data-y="4" x="40" y="49.25" fill="#334155" font-size="15.692307692307693" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Pair-only bus: match without artificial length headroom</text><text data-type="text" data-label="AFTER: 2/2 connected | copper DRC passed" data-x="-8" data-y="3.5" x="40" y="81.125" fill="#166534" font-size="15.692307692307693" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">AFTER: 2/2 connected | copper DRC passed</text><text data-type="text" data-label="0.2 mm edge clearance | 0.1 mm trace width" data-x="-8" data-y="3" x="40" y="113" fill="#334155" font-size="15.692307692307693" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">0.2 mm edge clearance | 0.1 mm trace width</text><text data-type="text" data-label="1 bus / 1 pair constraints passed | pair skew 0.0000 mm" data-x="-8" data-y="2.5" x="40" y="144.875" fill="#334155" font-size="15.692307692307693" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">1 bus / 1 pair constraints passed | pair skew 0.0000 mm</text><g><circle data-type="point" data-label="P source [top]" data-x="-6" data-y="-0.5" cx="167.5" cy="336.125" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="P target [top]" data-x="6" data-y="-0.5" cx="932.5" cy="336.125" r="3" fill="#d97706"/></g><g><circle data-type="point" data-label="N source [top]" data-x="-6" data-y="0.5" cx="167.5" cy="272.375" r="3" fill="#2563eb"/></g><g><circle data-type="point" data-label="N target [top]" data-x="6" data-y="0.5" cx="932.5" cy="272.375" r="3" fill="#d97706"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="481" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1100" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1100');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '481');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":63.75,"c":0,"e":550,"b":0,"d":-63.75,"f":304.25};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>